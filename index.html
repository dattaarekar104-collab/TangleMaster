<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1248" />
    <title>Tangle Master</title>
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000 url("/loading/tiled-background.png") center / cover no-repeat;
        pointer-events: auto;
      }
      .boot-splash.hidden {
        display: none !important;
      }
      .boot-splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(86vw, 560px);
        padding: 0 16px;
      }
      .boot-logo {
        display: block;
        width: 100%;
        max-width: 520px;
        height: auto;
        background: transparent;
      }
      .boot-loading {
        margin: 28px 0 0;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(22px, 5.4vw, 34px);
        font-weight: 800;
      }
      .boot-url {
        position: absolute;
        right: max(14px, env(safe-area-inset-right, 0px));
        bottom: max(14px, env(safe-area-inset-bottom, 0px));
        width: min(46vw, 260px);
        height: auto;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" aria-label="Loading">
      <div class="boot-splash-center">
        <img
          class="boot-logo"
          src="/loading/logo.png"
          alt="FandomWire Gaming"
          draggable="false"
        />
        <p class="boot-loading">Loading ...</p>
      </div>
      <img
        class="boot-url"
        src="/loading/website-name.png"
        alt="FANDOMWIREGAMING.COM"
        draggable="false"
      />
    </div>
    <div id="game-root"></div>
    <div id="ui-root"></div>
    <script>
      window.__bootSplashDone = new Promise((resolve) => {
        window.setTimeout(() => {
          const splash = document.getElementById("boot-splash");
          if (splash) splash.classList.add("hidden");
          resolve();
        }, 2000);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
